# ============================================================
#  Hexo 站点配置 —— Cos-Cross 的个人博客
#  改完执行 `npm run build`,再把产物推到 gh-pages 即可发布。
# ============================================================

# ---------- 站点信息 ----------
title: Cos-CrossのBlogger
subtitle: OI · MO · Rhythm Game
description: Cos-Cross 的个人博客 —— 记录编程/数学/音游的学习和点滴
keywords: Cos-Cross,个人博客,编程,数学,音游,JavaScript,Python,OI,前端
author: Cos-Cross
language: zh-CN
timezone: Asia/Shanghai

# 项目清单校验用(npm run projects)。工具只请求 GitHub 的公开接口,
# 未认证请求看不到任何私有仓库,所以私有仓库一旦写进清单就会被当场发现。
github_user: cos-cross

# ---------- 网址 ----------
url: https://cos-cross.github.io
root: /
permalink: posts/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# ---------- 目录 ----------
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# ---------- 文章 ----------
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

# ---------- 高亮 ----------
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: '  '
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# ---------- 首页 / 归档分页 ----------
index_generator:
  path: ''
  per_page: 6
  order_by: -date

per_page: 10
pagination_dir: page

archive_generator:
  enabled: true
  per_page: 30
  yearly: true
  monthly: false
  daily: false
  order_by: -date

category_generator:
  enabled: true
  per_page: 12

tag_generator:
  enabled: true
  per_page: 24

# ---------- 分类 / 标签默认值 ----------
default_category: 随笔
category_map:
tag_map:

# ---------- 日期格式 ----------
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

# ---------- RSS ----------
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true
  content_limit: 140
  content_limit_delim: ' '

# ---------- 本地预览 ----------
server:
  port: 4000
  compress: true
  header: true
  cache: false

# ---------- 主题 ----------
theme: cos-cross

# 注意:本项目用 scripts/deploy.mjs 把 public/ 推到 gh-pages 分支,
# 所以这里不配置 hexo-deployer-git,避免把令牌写进配置文件。
deploy: {}
