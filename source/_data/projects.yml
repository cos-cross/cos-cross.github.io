# ============================================================
#  项目 / 作品清单
#  首页只显示前 N 个(在主题 _config.yml 的 home.projects 里改),
#  /projects/ 页面会按 group 分组显示全部。
#  字段说明:
#    name    项目名
#    desc    一句话介绍
#    lang    主要语言(显示在右上角)
#    link    在线体验地址(有 Pages 的项目才有)
#    repo    GitHub 仓库地址
#    tags    标签数组
#    icon    图标: code / star / music / link
#    accent  配色: cyan / violet / pink / lime / gold
#    group   分组名
# ============================================================

