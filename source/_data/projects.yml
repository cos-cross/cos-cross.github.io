# ============================================================
#  项目 / 作品清单 —— 这就是网站上项目展示的唯一数据源
#
#  【删除】直接删掉整段 `- name: xxx` 到下一个 `- name:` 之间的内容
#  【暂时隐藏】在那一项里加一行 `hidden: true`,不用删
#  【调整顺序】数组顺序就是显示顺序,首页只取前几个
#  【添加】复制一段改字段,或者用命令自动生成骨架:
#           npm run projects -- add <仓库名>
#  【自动】新仓库不用手动加 —— `npm run deploy` 会先跑一次
#           `npm run projects -- sync`,把还没收录的公开仓库自动补进来
#           (个人资料仓库 `<用户名>/<用户名>`、fork、以及 AUTO_SYNC_SKIP 里的会跳过)
#
#  改完记得 `npm run check` 自检、`npm run deploy` 发布。
#
#  ⚠️ 私有仓库不要写进来! 这个文件会公开在 GitHub 上,
#     而且渲染出来人人可见。发布前可以跑:
#           npm run projects -- check
#     它会用「公开」接口核对,私有 / 已删除 / 改名的仓库会被当场揪出来。
#
#  字段说明:
#    name    项目名(必填)
#    desc    一句话介绍
#    lang    主要语言(显示在卡片右上角)
#    link    在线体验地址(有 Pages 的项目才有)
#    repo    GitHub 仓库地址
#    tags    标签数组
#    icon    图标: code / star / music / link
#    accent  配色: cyan / violet / pink / lime / gold
#    group   分组名(/projects/ 页面按它分组)
#    hidden  true 则不展示(默认 false)
# ============================================================

