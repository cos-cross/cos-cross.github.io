<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Cos-Cross">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2ee6ff"/>
      <stop offset="48%" stop-color="#9b7bff"/>
      <stop offset="100%" stop-color="#ff5fd0"/>
    </linearGradient>
    <radialGradient id="bg" cx="32%" cy="22%" r="95%">
      <stop offset="0%" stop-color="#232349"/>
      <stop offset="55%" stop-color="#101024"/>
      <stop offset="100%" stop-color="#06060e"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clipCircle">
      <circle cx="64" cy="64" r="59"/>
    </clipPath>
  </defs>

  <circle cx="64" cy="64" r="64" fill="#06060e"/>
  <circle cx="64" cy="64" r="59" fill="url(#bg)"/>

  <g clip-path="url(#clipCircle)" opacity=".5">
    <path d="M0 34h128M0 64h128M0 94h128M34 0v128M64 0v128M94 0v128"
          stroke="#9b7bff" stroke-opacity=".14" stroke-width="1"/>
  </g>

  <g clip-path="url(#clipCircle)">
    <circle cx="64" cy="64" r="59" fill="url(#shine)"/>
  </g>

  <g clip-path="url(#clipCircle)">
    <path d="M30 92 L52 44 L64 74 L76 44 L98 92" fill="none" stroke="url(#neon)" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round" opacity=".22"/>
  </g>

  <text x="64" y="82" text-anchor="middle"
        font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif"
        font-size="50" font-weight="900" letter-spacing="-2" fill="url(#neon)">CX</text>

  <g transform="translate(92 22)">
    <circle cx="0" cy="0" r="13" fill="#06060e" stroke="url(#neon)" stroke-width="2"/>
    <text x="0" y="7" text-anchor="middle"
          font-family="'Segoe UI Symbol', 'Apple Symbols', serif" font-size="17" fill="url(#neon)">♪</text>
  </g>

  <circle cx="64" cy="64" r="59.5" fill="none" stroke="url(#neon)" stroke-width="3"/>
  <circle cx="64" cy="64" r="63" fill="none" stroke="url(#neon)" stroke-width="1" opacity=".45"/>
</svg>
