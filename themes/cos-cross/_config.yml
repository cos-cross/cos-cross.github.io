# ============================================================
#  Cos-Cross 博客主题配置(二次元音游风)
#  改完直接 `npm run build` 即可,不需要动模板代码。
# ============================================================

# 顶部导航(顺序即显示顺序,想隐藏某一项就删掉那一行)
menu:
  首页: /
  文章: /archives/
  项目: /projects/
  关于: /about/

# 站点主人信息
profile:
  # 站名默认取站点 _config.yml 的 title。下面这行注释着就是"跟随站点标题";
  # 只有当导航和页脚想显示一个比站点标题更短的名字时,才把它打开。
  # name: Cos-Cross
  handle: "@Cos_Cross"
  avatar: '/img/avatar.jpg'
  favicon: '/img/favicon-32.png'
  appleTouchIcon: '/img/apple-touch-icon.png'
  bio: 高中生 · 编程 / 数学 / 音游

# 首页大屏(hero)
hero:
  greeting: "PLAYER 1"
  # 标题和副标题默认取站点 _config.yml 的 title / subtitle,改了站点配置这里会自动跟着变。
  # 只有想让首页大屏显示一句不一样的话时,才打开下面两行。
  # title:
  # subtitle:
  # desc 留空则用站点 _config.yml 的 description
  desc: "把灵感写成代码,把热爱打成 PERFECT。"
  tags:
    - JavaScript
    - Python
    - OI
    - Math
    - Music Game
  buttons:
    - text: 开始阅读
      link: /archives/
      primary: true
    - text: 我的项目
      link: /projects/
      primary: false

# 首页各板块显示条数
home:
  posts: 6
  projects: 3
  show_tags: true

# 社交链接(icon 可选:github / bilibili / mail / link)
social:
  - name: GitHub
    icon: github
    link: https://github.com/cos-cross
  - name: Bilibili
    icon: bilibili
    link: https://space.bilibili.com/388480733
  - name: 邮箱
    icon: mail
    link: mailto:coscross@126.com

# 文章页
post:
  toc: true            # 显示目录
  reading_time: true   # 显示预计阅读时间
  prev_next: true      # 上一篇 / 下一篇
  updated: true        # 显示最后更新时间

# 页脚
footer:
  since: 2025
  slogan: "Made with Hexo · Hosted on GitHub Pages"

# 动效开关(觉得太花可以把它们关掉)
effects:
  aurora: true      # 背景极光光晕
  particles: true   # 飘浮音符粒子
  combo: true       # 右下角连击 HUD
  reveal: true      # 滚动淡入

# ============================================================
#  背景
#  mode: aurora = 默认的霓虹极光(纯 CSS,零流量)
#        media  = 用你自己的视频 / 图片(比如 Wallpaper Engine 的壁纸)
#        none   = 纯色背景
#
#  换成壁纸的推荐流程:
#    1. npm run wallpaper -- <创意工坊ID>   把壁纸里的媒体文件导进来
#    2. 打开下面的 mode: media
#    3. npm run deploy
# ============================================================
background:
  mode: media

  # mode: media 时生效。视频优先,留空则用 image。
  video: '/media/background.mp4'
  image: ''
  poster: '/media/background.jpg'

  overlay: 0.62        # 压暗程度 0~1。文字看不清就调大,想让壁纸更明显就调小
  blur: 3              # 背景模糊(px)。3~6 能显著提升文字可读性,0 = 不模糊
  scale: 1.06          # 轻微放大,避免模糊后边缘露出底色

  mobile: poster       # 手机上显示:poster(只显示封面,省流量)/ video / off
  control: true        # 右下角显示「暂停背景」按钮

